name: Android APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'metadata.json'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANU_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          ls -ld "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK and run unit tests
        run: |
          gradle --version
          gradle :app:assembleRelease :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Locate and normalize APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          echo "Release outputs:"
          find app/build/outputs/apk/release -maxdepth 1 -type f -print -exec ls -lh {} \;
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          NORMALIZED_APK="app/build/outputs/apk/release/LANU-Not-Defteri-v1.0.${{ github.run_number }}.apk"
          cp "$APK_PATH" "$NORMALIZED_APK"
          test -s "$NORMALIZED_APK"
          echo "apk_path=$NORMALIZED_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$NORMALIZED_APK"

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.apk_path }}"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"

      - name: Verify APK manifest versionCode matches release run
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          APK="${{ steps.apk.outputs.apk_path }}"
          ACTUAL="$("$AAPT" dump badging "$APK" |
            sed -n "s/^package:.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p")"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$LANU_VERSION_CODE"

      - name: Generate and verify APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.apk_path }}"
          cd "$(dirname "$APK")"
          sha256sum "$(basename "$APK")" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LANU-Not-Defteri-v1.0.${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.apk_path }}
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LANU Not Defteri v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.apk.outputs.apk_path }}
            app/build/outputs/apk/release/SHA256SUMS.txt
